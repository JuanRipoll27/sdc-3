# Run from this folder: docker compose up -d --build
services:
  frontend:
    build: ./frontend
    image: stylelab-frontend
    ports:
      - "8501:8501"
    environment:
      APP_BACKEND_URL: http://backend:80
    depends_on:
      - backend

  backend:
    build: ./backend
    image: stylelab-backend
    ports:
      - "8080:80"
